<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Manage Weekly Breakdown</title>

    <!-- CSS framework or stylesheet -->
    <link rel="stylesheet" href="../common/styles.css">

    <!-- Required: link admin.js with defer -->
    <script src="admin.js" defer></script>
</head>
<body>

    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <main>

        <!-- ============================================================
             Section 1: Add / Edit Week Form
             ============================================================ -->
        <section>
            <h2>Add a New Week</h2>

            <!-- The id "week-form" is required by admin.js -->
            <form id="week-form" action="#">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <label for="week-title">Week Title</label>
                    <input type="text" id="week-title" required placeholder="Week 1: Introduction to HTML">

                    <label for="week-start-date">Start Date</label>
                    <input type="date" id="week-start-date" required>

                    <label for="week-description">Description</label>
                    <textarea id="week-description" rows="5"></textarea>

                    <label for="week-links">Resource Links (one URL per line)</label>
                    <textarea id="week-links" rows="3"></textarea>

                    <button type="submit" id="add-week">Add Week</button>
                </fieldset>
            </form>
        </section>


        <!-- ============================================================
             Section 2: Existing Weekly Entries
             ============================================================ -->
        <section>
            <h2>Current Weekly Breakdown</h2>

            <table id="weeks-table">
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Start Date</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <!-- The id "weeks-tbody" is required by admin.js so it can inject <tr> rows. -->
                <tbody id="weeks-tbody">
                    <!-- admin.js will inject rows here. Each row follows this structure:
                    <tr>
                        <td>Week 1: Introduction to HTML</td>
                        <td>2025-01-13</td>
                        <td>Learn HTML fundamentals...</td>
                        <td>
                            <button class="edit-btn" data-id="1">Edit</button>
                            <button class="delete-btn" data-id="1">Delete</button>
                        </td>
                    </tr>
                    The data-id attribute holds the integer id from the weeks table (primary key). -->
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
